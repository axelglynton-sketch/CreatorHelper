
name: Build Creator Helper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build Android Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CreatorHelper-Android64
          path: output/*.geode
